<!DOCTYPE html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no" />
    <title>Mahjong</title>
    <script src="./index.js" defer type="module"></script>
    <link
      href="https://fonts.googleapis.com/css2?family=Long+Cang&family=Work+Sans:wght@400;600&display=swap"
      rel="stylesheet"
    />
    <style>
      :root {
        --image-table: url("./images/table.png");
        --font-english: "Work Sans", sans-serif;
        --font-chinese: "Long Cang", cursive;

        /* Accent green -- the confirm / primary-positive note worn by 胡, 再来一局,
           open seats and every primary dialog button. One set of shades so the
           three ad-hoc greens that had drifted apart (base / hover / active) stay
           in step, and one dark ink for text sitting on a green fill. */
        --green: #addc91;
        --green-hover: #c6ebaf;
        --green-active: #92c474;
        --green-ink: #14301c;

        /* Danger (kick / remove) and score signs, shared so they cannot drift. */
        --danger-border: rgba(255, 140, 140, 0.6);
        --danger-text: #ffb3b3;
        --score-positive: #4caf50;
        --score-negative: #f44336;

        /* Surfaces: the dark-green dialog card and the black-glass panels. */
        --card-bg: rgba(20, 40, 26, 0.97);
        --card-border: rgba(255, 255, 255, 0.25);
        --panel-bg: rgba(0, 0, 0, 0.6);

        --radius: 10px;
      }

      /* One modal shell for every "are you sure?" / name / seat prompt, so they
         no longer each re-declare a slightly different card. Global (not scoped
         to a component) so any dialog can wear it. */
      .mj-backdrop {
        position: fixed;
        inset: 0;
        background: rgba(0, 0, 0, 0.55);
        z-index: 10;
      }

      .mj-card {
        position: fixed;
        left: 50%;
        top: 50%;
        transform: translate(-50%, -50%);
        display: flex;
        flex-direction: column;
        width: min(340px, 84vw);
        padding: clamp(16px, 4vw, 24px);
        border: 1px solid var(--card-border);
        border-radius: var(--radius);
        background: var(--card-bg);
        box-sizing: border-box;
        z-index: 11;
      }

      .mj-title {
        color: white;
        font-family: var(--font-chinese);
        font-size: clamp(14pt, 4vw, 18pt);
        text-align: center;
        margin: 0 0 12px;
      }

      .mj-body {
        color: rgba(255, 255, 255, 0.9);
        font-family: var(--font-chinese);
        font-size: clamp(12pt, 3.5vw, 15pt);
        line-height: 1.5;
        text-align: center;
      }

      /* A quieter sub-note under a title (e.g. "本局已开始，下一局入座"). */
      .mj-note {
        color: rgba(255, 255, 255, 0.7);
        font-family: var(--font-chinese);
        font-size: clamp(10pt, 2.8vw, 12pt);
        text-align: center;
      }

      .mj-error {
        color: var(--danger-text);
        font-family: var(--font-english);
        font-size: clamp(10pt, 3vw, 12pt);
        text-align: center;
        padding-top: 10px;
      }

      .mj-input {
        font-size: clamp(14pt, 4vw, 16pt);
        border: none;
        background: none;
        border-bottom: 1px solid rgba(255, 255, 255, 0.3);
        padding: 10px 0;
        color: white;
        font-family: var(--font-english);
        width: 100%;
        box-sizing: border-box;
      }

      .mj-input:focus {
        outline: none;
        border-bottom-color: rgba(255, 255, 255, 0.8);
      }

      .mj-buttons {
        display: flex;
        justify-content: flex-end;
        gap: 10px;
        margin-top: 18px;
      }

      /* One button. The base carries shape, font and -- finally -- consistent
         hover / active / keyboard-focus feedback, so every control presses the
         same way; the variants below add only colour. */
      .mj-btn {
        border: 1px solid rgba(255, 255, 255, 0.3);
        border-radius: 6px;
        background: rgba(255, 255, 255, 0.12);
        color: white;
        font-family: var(--font-chinese);
        font-size: clamp(12pt, 3.5vw, 14pt);
        padding: 8px 18px;
        cursor: pointer;
        transition: background 0.15s, border-color 0.15s, transform 0.05s;
      }

      .mj-btn:hover { background: rgba(255, 255, 255, 0.22); }
      .mj-btn:active { transform: translateY(1px); }
      .mj-btn:focus-visible { outline: 2px solid var(--green); outline-offset: 2px; }
      .mj-btn:disabled { opacity: 0.5; cursor: default; transform: none; }
      .mj-btn:disabled:hover { background: rgba(255, 255, 255, 0.12); }

      /* Primary is green everywhere now -- it used to be a translucent white in
         the dialogs and green only on 再来一局, saying the same "yes, this one"
         two different ways. */
      .mj-btn--primary {
        background: var(--green);
        border-color: var(--green);
        color: var(--green-ink);
      }
      .mj-btn--primary:hover { background: var(--green-hover); }
      .mj-btn--primary:active { background: var(--green-active); }

      .mj-btn--danger {
        border-color: var(--danger-border);
        color: var(--danger-text);
      }
      .mj-btn--danger:hover { background: rgba(244, 67, 54, 0.2); }

      body {
        position: relative;
        margin: 0;
        padding: 0;
        width: 100vw;
        height: 100vh;
        overflow: hidden;
        background-color: black;
        touch-action: manipulation;
        -webkit-touch-callout: none;
        -webkit-user-select: none;
        user-select: none;
      }

      :global(#root) {
        position: absolute;
        width: 100vw;
        height: 100vh;
      }
    </style>
  </head>
  <body>
    <div id="root"></div>
  </body>
</html>
